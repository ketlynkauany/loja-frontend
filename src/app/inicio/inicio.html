<div class="pagina">

  <app-carrinho></app-carrinho>

  <h1>Lista de Produtos</h1>

  <div class="produtos">
    @for (p of produtos(); track p.id) {
      <div class="produto">
        <h2>{{ p.nome }}</h2>

        <p class="preco">R$ {{ p.preco }}</p>

        <button (click)="adicionar(p)">
          Adicionar ao carrinho
        </button>
      </div>
    }
  </div>

</div>
